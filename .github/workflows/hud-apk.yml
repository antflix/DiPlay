name: Build DiPlay Pi HUD APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hud-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out HUD source
        uses: actions/checkout@v4

      - name: Check source excludes credentials
        run: python3 scripts/check_public_tree.py

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Android toolchain
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Recover public-release accessory files for local car testing
        shell: bash
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/DiPlay-0.2.22.apk"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/shihabal3amri/DiPlay/releases/download/v0.2.22/DiPlay-0.2.22.apk" \
            --output "$apk"
          echo "7d04db263834f22010a86847766928113d3503a273e4d2d3440d21552e173139  $apk" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/diplay-auth/offline-mfi"
          unzip -p "$apk" assets/offline-mfi/identity.pk8 > "$RUNNER_TEMP/diplay-auth/offline-mfi/identity.pk8"
          unzip -p "$apk" assets/offline-mfi/certificate.p7b > "$RUNNER_TEMP/diplay-auth/offline-mfi/certificate.p7b"
          test -s "$RUNNER_TEMP/diplay-auth/offline-mfi/identity.pk8"
          test -s "$RUNNER_TEMP/diplay-auth/offline-mfi/certificate.p7b"

      - name: Optionally restore a stable test signing key
        env:
          KEY_B64: ${{ secrets.DIPLAY_DEBUG_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$KEY_B64" ]]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$KEY_B64" | base64 -d > "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey >/dev/null
          else
            echo "::notice::Using temporary Android debug signing. Future test updates may require uninstalling the previous HUD test APK."
          fi

      - name: Build CarPlay-capable HUD test APK
        env:
          DIPLAY_AUTH_ASSETS_DIR: ${{ runner.temp }}/diplay-auth
        run: |
          ./gradlew :mobile:assembleStandaloneDebug --stacktrace

      - name: Prepare downloadable APK
        shell: bash
        run: |
          mkdir -p dist
          cp mobile/build/outputs/apk/debug/mobile-debug.apk dist/DiPlay-Pi-HUD.apk
          sha256sum dist/DiPlay-Pi-HUD.apk > dist/SHA256SUMS.txt

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-Pi-HUD
          path: |
            dist/DiPlay-Pi-HUD.apk
            dist/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub release with direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="pi-hud-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/DiPlay-Pi-HUD.apk dist/SHA256SUMS.txt \
            --title "DiPlay Pi HUD build ${GITHUB_RUN_NUMBER}" \
            --target "$GITHUB_SHA" \
            --notes "Personal DiPlay CarPlay HUD test. Forwards turn-by-turn navigation to Raspberry Pi 192.168.8.136:8765. Installs alongside stock DiPlay as com.shihab.diplay.hudtest. Contains the extractable experimental identity from verified upstream 0.2.22 APK; do not assume universal CarPlay compatibility. If Android signing differs from previous test build, uninstall that test build before updating. Keep the working original DiPlay installed."
